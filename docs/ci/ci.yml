# Integração contínua do DogWalker (GitHub Actions)
#
# COMO ATIVAR: este arquivo fica em docs/ci/ porque publicar workflows exige
# o escopo "workflow" no token do GitHub. Para ativar:
#   1. gh auth refresh -h github.com -s workflow
#   2. copie este arquivo para .github/workflows/ci.yml e faça o commit
#
# O que roda em cada push e Pull Request para a main:
#   - Linux:   build rigoroso (-Werror), testes, cppcheck, cenários ponta a
#              ponta (tests/cenarios.sh) e testes com AddressSanitizer + UBSan
#   - Windows: build com MinGW, testes unitários e os cenários ponta a ponta
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (gcc, cppcheck, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Build rigoroso
        run: make strict

      - name: Testes unitários
        run: make test

      - name: Análise estática
        run: make lint

      - name: Cenários ponta a ponta (sh)
        run: make && make cenarios

      - name: Testes com AddressSanitizer e UBSan
        run: |
          gcc -std=c11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Iinclude tests/test_dogwalker.c $(ls src/*.c | grep -v main.c) -o test_asan
          ./test_asan

  windows:
    name: Windows (MinGW, cenários)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: mingw32-make

      - name: Testes unitários
        run: mingw32-make test

      - name: Cenários ponta a ponta
        run: mingw32-make cenarios
